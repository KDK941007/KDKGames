name: Repair RPG Split

on:
  push:
    branches:
      - feature/portal-structure-v2
    paths:
      - 'tools/repair_rpg_split.py'
      - '.github/workflows/repair-rpg-split.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-structure-v2
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore RPG split files
        run: python tools/repair_rpg_split.py
      - name: Rebuild manifests
        run: python tools/build_game_manifest.py
      - name: Validate structure
        run: python tools/validate_structure.py
      - name: Validate JavaScript syntax
        run: node --check games/rpg/rpg/js/game.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No RPG repair changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/rpg/rpg portal/games.json portal/games.js
          git commit -m 'fix: restore RPG assets and game logic after split'
          git push origin HEAD:feature/portal-structure-v2
