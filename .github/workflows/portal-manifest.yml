name: Build Portal Game Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'games/**'
      - 'tools/build_game_manifest.py'
      - '.github/workflows/portal-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifests
        run: python tools/build_game_manifest.py

      - name: Commit manifests when changed
        shell: bash
        run: |
          if git diff --quiet -- portal/games.json portal/games.js; then
            echo 'Portal manifests are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portal/games.json portal/games.js
          git commit -m 'chore: update portal game manifests'
          git push
