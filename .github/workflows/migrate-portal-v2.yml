name: Migrate Portal Structure V2

on:
  push:
    branches:
      - feature/portal-structure-v2
    paths:
      - 'tools/migrate_portal_v2.py'
      - '.github/workflows/migrate-portal-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/portal-structure-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run migration
        run: python tools/migrate_portal_v2.py

      - name: Commit migrated structure
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html sw.js games portal shared
          git add -u -- blackjack baccarat flash-rush laser-escape marubatsu rpg
          git commit -m 'refactor: migrate games to portal structure v2'
          git push origin HEAD:feature/portal-structure-v2
