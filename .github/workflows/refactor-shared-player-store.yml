name: Refactor Shared Player Store

on:
  push:
    branches:
      - feature/portal-structure-v2
    paths:
      - 'tools/refactor_shared_player_store.py'
      - '.github/workflows/refactor-shared-player-store.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/portal-structure-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refactor duplicated player-store helpers
        run: python tools/refactor_shared_player_store.py

      - name: Rebuild game manifest
        run: python tools/build_game_manifest.py

      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No refactor changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games shared/js/player-store.js portal/games.json
          git commit -m 'refactor: share portal player storage across games'
          git push origin HEAD:feature/portal-structure-v2
