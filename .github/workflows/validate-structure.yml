name: Validate Portal Structure

on:
  push:
    branches:
      - main
      - feature/portal-structure-v2
  pull_request:
    paths:
      - 'games/**'
      - 'portal/**'
      - 'shared/**'
      - 'index.html'
      - 'sw.js'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate structure
        run: python tools/validate_structure.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find games portal shared -type f -name '*.js' -print0)
