<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>消える○×ゲーム</title>

<style>
  :root{
    --bg:#0b1020;
    --panel:#151c31;
    --panel2:#1b2440;
    --text:#f8fafc;
    --muted:#9aa7bd;
    --line:#2b3657;
    --x:#60a5fa;
    --o:#fb7185;
    --accent:#fbbf24;
    --shadow:0 18px 50px rgba(0,0,0,.35);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  }

  body{
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:
      max(6px, env(safe-area-inset-top))
      10px
      max(6px, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at top, rgba(59,130,246,.16), transparent 34%),
      radial-gradient(circle at bottom right, rgba(244,63,94,.12), transparent 30%),
      var(--bg);
  }

  button{font:inherit}

  .app{
    width:min(100%,460px);
    height:100%;
    min-height:0;
  }

  .card{
    width:100%;
    height:100%;
    min-height:0;
    display:grid;
    grid-template-rows:
      74px
      76px
      minmax(0,1fr)
      62px;
    background:rgba(21,28,49,.94);
    border:1px solid rgba(255,255,255,.07);
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  header{
    padding:12px 18px 6px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
  }

  h1{
    font-size:24px;
    line-height:1.15;
    margin:0 0 5px;
    letter-spacing:.02em;
  }

  .sub{
    font-size:11px;
    color:var(--muted);
    line-height:1.35;
  }

  .status-wrap{
    padding:6px 14px;
    min-height:0;
  }

  .status{
    height:64px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
  }

  .status-left{
    min-width:0;
    flex:1 1 auto;
  }

  .starter-area{
    width:min(100%,270px);
  }

  .starter-label{
    margin-bottom:4px;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    line-height:1;
  }

  .starter-inline{
    display:none;
    grid-template-columns:1.35fr 1fr 1fr;
    gap:6px;
    width:100%;
  }

  .starter-inline.show{
    display:grid;
  }

  .starter-choice{
    height:36px;
    min-width:0;
    border:1px solid var(--line);
    border-radius:10px;
    background:#273351;
    color:var(--text);
    font-size:11px;
    font-weight:900;
    cursor:pointer;
  }

  .starter-choice.random{
    background:#f8fafc;
    color:#111827;
    border-color:#f8fafc;
  }

  .starter-choice.o{color:var(--o)}
  .starter-choice.x{color:var(--x)}

  .turn-view{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
  }

  .turn-view.hidden{
    display:none;
  }

  .turn-label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:3px;
  }

  .turn-main{
    font-weight:800;
    font-size:19px;
    line-height:1.15;
  }

  .turn-symbol{
    width:42px;
    text-align:center;
    font-size:32px;
    font-weight:900;
    line-height:1;
  }

  .turn-symbol.x{color:var(--x)}
  .turn-symbol.o{color:var(--o)}

  .board-wrap{
    min-height:0;
    padding:6px 14px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .board{
    height:100%;
    width:auto;
    max-width:100%;
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,minmax(0,1fr));
    gap:7px;
  }

  .cell{
    position:relative;
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    padding:0;
    border:1px solid var(--line);
    border-radius:15px;
    background:linear-gradient(180deg,#1a2340,#151c31);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(38px,14vw,72px);
    font-weight:900;
    cursor:pointer;
    user-select:none;
    transition:transform .09s ease,border-color .15s ease,background .15s ease,filter .15s ease;
    overflow:hidden;
  }

  .cell:active{transform:scale(.96)}
  .cell.x{color:var(--x)}
  .cell.o{color:var(--o)}

  .cell.oldest{
    border-color:var(--accent);
    box-shadow:inset 0 0 0 1px rgba(251,191,36,.28);
  }

  .cell.oldest::after{
    content:"次に消える";
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:9px;
    font-weight:800;
    line-height:1;
    color:#111827;
    background:var(--accent);
    padding:4px 6px;
    border-radius:999px;
  }

  .cell.winner{
    animation:winPulse .7s ease-in-out infinite alternate;
  }

  @keyframes winPulse{
    from{filter:brightness(1)}
    to{filter:brightness(1.38)}
  }

  .actions{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    padding:4px 14px 10px;
  }

  .action-btn{
    height:46px;
    min-width:0;
    padding:0 6px;
    border:0;
    border-radius:13px;
    font-weight:800;
    font-size:12px;
    white-space:nowrap;
    cursor:pointer;
  }

  .restart{
    background:#f8fafc;
    color:#111827;
  }

  .rules{
    background:#273351;
    color:var(--text);
    border:1px solid var(--line);
  }

  .portal{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#273351;
    color:var(--text);
    border:1px solid var(--line);
  }

  .confirm-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
  }

  .confirm-btn{
    height:46px;
    border-radius:13px;
    font-weight:900;
    cursor:pointer;
  }

  .confirm-cancel{
    border:1px solid var(--line);
    background:#273351;
    color:var(--text);
  }

  .confirm-go{
    border:0;
    background:#f8fafc;
    color:#111827;
  }

  .overlay{
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(3,7,18,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:
      max(14px, env(safe-area-inset-top))
      16px
      max(14px, env(safe-area-inset-bottom));
  }

  .overlay.show{display:flex}

  .modal{
    width:min(100%,420px);
    max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow:auto;
    background:#151c31;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:18px;
  }

  .modal h2{
    margin:0 0 10px;
    font-size:21px;
  }

  .modal p,.modal li{
    color:#c2ccdc;
    font-size:13px;
    line-height:1.6;
  }

  .modal ol{
    padding-left:21px;
    margin:8px 0 16px;
  }

  .close{
    width:100%;
    height:46px;
    border:0;
    border-radius:13px;
    background:#f8fafc;
    color:#111827;
    font-weight:800;
  }

  .secondary-close{
    margin-top:9px;
    background:#273351;
    color:var(--text);
    border:1px solid var(--line);
  }

  .winner-panel{text-align:center}

  .winner-big{
    font-size:56px;
    font-weight:900;
    margin:2px 0;
  }

  .winner-text{
    font-size:21px;
    font-weight:900;
    margin-bottom:5px;
  }

  .winner-sub{
    color:var(--muted);
    font-size:12px;
    margin-bottom:16px;
  }

  @media (max-height:700px){
    .card{
      grid-template-rows:
        64px
        68px
        minmax(0,1fr)
        56px;
    }

    h1{font-size:21px}
    .sub{font-size:10px}
    .status{height:56px}
    .turn-main{font-size:17px}
    .turn-symbol{font-size:29px}
    .action-btn{height:42px}
    .cell.oldest::after{font-size:8px;padding:3px 5px}
  }
</style>

</head>
<body>
<main class="app">
  <section class="card">
    <header>
      <h1>消える○×ゲーム</h1>
      <div class="sub">4個目を置くと、自分の一番古いコマが消える三目並べ</div>
    </header>

    <div class="status-wrap">
            <div class="status">
        <div class="status-left">
          <div class="turn-view hidden" id="turnView">
            <div>
              <div class="turn-label" id="statusLabel">現在のターン</div>
              <div class="turn-main" id="statusText">○ の番</div>
            </div>
            <div class="turn-symbol o" id="turnSymbol">○</div>
          </div>

          <div class="starter-area" id="starterArea">
            <div class="starter-label">先攻を選択</div>
            <div class="starter-inline show" id="starterInline" aria-label="先攻を選択">
              <button class="starter-choice random" type="button" data-start="random">ランダム</button>
              <button class="starter-choice o" type="button" data-start="O">○から</button>
              <button class="starter-choice x" type="button" data-start="X">×から</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="○×ゲーム盤"></div>
    </div>

    <div class="actions">
      <button class="action-btn restart" id="restartBtn">最初から</button>
      <button class="action-btn rules" id="rulesBtn">ルール</button>
      <button class="action-btn portal" id="portalBtn" type="button">ポータルへ戻る</button>
    </div>
  </section>
</main>


<div class="overlay" id="rulesOverlay">
  <div class="modal">
    <h2>遊び方</h2>
    <ol>
      <li>× と ○ が交互に空いているマスへ置きます。</li>
      <li>縦・横・斜めのどれかに3つ並べると勝ちです。</li>
      <li>各プレイヤーが盤面に残せるコマは最大3個です。</li>
      <li>4個目を置くと、そのプレイヤーの一番古いコマが消えます。</li>
      <li>ゲーム中は、黄色い「次に消える」表示で消える予定のコマを確認できます。</li>
    </ol>
    <button class="close" id="closeRules">閉じる</button>
  </div>
</div>

<div class="overlay" id="winnerOverlay">
  <div class="modal winner-panel">
    <div class="winner-big" id="winnerSymbol">×</div>
    <div class="winner-text" id="winnerText">× の勝ち！</div>
    <div class="winner-sub">3つ並びました</div>
    <button class="close" id="playAgainBtn">閉じる</button>
  </div>
</div>

<div class="overlay" id="portalConfirmOverlay">
  <div class="modal">
    <h2>ポータルへ戻る</h2>
    <p>ポータルへ戻りますか？<br>現在のゲーム内容は失われます。</p>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-cancel" id="cancelPortalBtn" type="button">キャンセル</button>
      <button class="confirm-btn confirm-go" id="confirmPortalBtn" type="button">戻る</button>
    </div>
  </div>
</div>

<script>
(() => {
  const boardEl = document.getElementById('board');
  const statusLabel = document.getElementById('statusLabel');
  const statusText = document.getElementById('statusText');
  const turnSymbol = document.getElementById('turnSymbol');
  const turnView = document.getElementById('turnView');
  const starterArea = document.getElementById('starterArea');
  const starterInline = document.getElementById('starterInline');
  const starterButtons = [...document.querySelectorAll('.starter-choice')];

  const restartBtn = document.getElementById('restartBtn');
  const rulesBtn = document.getElementById('rulesBtn');

  const rulesOverlay = document.getElementById('rulesOverlay');
  const closeRules = document.getElementById('closeRules');

  const winnerOverlay = document.getElementById('winnerOverlay');
  const winnerSymbol = document.getElementById('winnerSymbol');
  const winnerText = document.getElementById('winnerText');
  const playAgainBtn = document.getElementById('playAgainBtn');

  const portalBtn = document.getElementById('portalBtn');
  const portalConfirmOverlay = document.getElementById('portalConfirmOverlay');
  const cancelPortalBtn = document.getElementById('cancelPortalBtn');
  const confirmPortalBtn = document.getElementById('confirmPortalBtn');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = null;
  let history = { X: [], O: [] };
  let gameOver = false;
  let winLine = [];

  function getSymbol(player) {
    return player === 'X' ? '×' : '○';
  }

  function resolveStartPlayer(mode) {
    if (mode === 'random') {
      return Math.random() < 0.5 ? 'O' : 'X';
    }
    return mode;
  }

  function resetState() {
    board = Array(9).fill(null);
    current = null;
    history = { X: [], O: [] };
    gameOver = false;
    winLine = [];
  }

  function showStarterSelection() {
    resetState();
    winnerOverlay.classList.remove('show');
    starterArea.style.display = '';
    starterInline.classList.add('show');
    turnView.classList.add('hidden');
    render();
  }

  function startGame(mode) {
    resetState();
    current = resolveStartPlayer(mode);

    starterInline.classList.remove('show');
    starterArea.style.display = 'none';
    turnView.classList.remove('hidden');
    winnerOverlay.classList.remove('show');

    render();
  }

  function render() {
    boardEl.innerHTML = '';

    const oldestX = !gameOver && history.X.length === 3 ? history.X[0] : -1;
    const oldestO = !gameOver && history.O.length === 3 ? history.O[0] : -1;

    board.forEach((value, index) => {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('aria-label', `${index + 1}番のマス`);
      cell.disabled = !current || gameOver;

      if (value) {
        cell.textContent = getSymbol(value);
        cell.classList.add(value.toLowerCase());

        if (index === oldestX || index === oldestO) {
          cell.classList.add('oldest');
        }
      }

      if (winLine.includes(index)) {
        cell.classList.add('winner');
      }

      cell.addEventListener('click', () => play(index));
      boardEl.appendChild(cell);
    });

    if (!gameOver && current) {
      statusLabel.textContent = '現在のターン';
      statusText.textContent = `${getSymbol(current)} の番`;
      turnSymbol.textContent = getSymbol(current);
      turnSymbol.className = `turn-symbol ${current.toLowerCase()}`;
    }
  }

  function play(index) {
    if (!current || gameOver || board[index]) return;

    if (history[current].length >= 3) {
      const oldest = history[current].shift();
      board[oldest] = null;
    }

    board[index] = current;
    history[current].push(index);

    const winning = findWin(current);

    if (winning) {
      gameOver = true;
      winLine = winning;
      render();
      showWinner(current);
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    render();
  }

  function findWin(player) {
    return WIN_LINES.find(line => line.every(i => board[i] === player)) || null;
  }

  function showWinner(player) {
    const symbol = getSymbol(player);

    winnerSymbol.textContent = symbol;
    winnerSymbol.style.color = player === 'X' ? 'var(--x)' : 'var(--o)';
    winnerText.textContent = `${symbol} の勝ち！`;

    statusLabel.textContent = 'ゲーム終了';
    statusText.textContent = `${symbol} の勝ち`;
    turnSymbol.textContent = symbol;
    turnSymbol.className = `turn-symbol ${player.toLowerCase()}`;

    setTimeout(() => {
      winnerOverlay.classList.add('show');
    }, 300);
  }

  starterButtons.forEach(button => {
    button.addEventListener('click', () => {
      startGame(button.dataset.start);
    });
  });

  // 「最初から」は盤面を初期化し、上部の先攻選択へ戻す。
  restartBtn.addEventListener('click', showStarterSelection);

  // 勝利後の「閉じる」は結果ポップアップを閉じるだけ。
  playAgainBtn.addEventListener('click', () => {
    winnerOverlay.classList.remove('show');
  });

  rulesBtn.addEventListener('click', () => {
    rulesOverlay.classList.add('show');
  });

  closeRules.addEventListener('click', () => {
    rulesOverlay.classList.remove('show');
  });

  rulesOverlay.addEventListener('click', e => {
    if (e.target === rulesOverlay) {
      rulesOverlay.classList.remove('show');
    }
  });

  portalBtn.addEventListener('click', () => {
    portalConfirmOverlay.classList.add('show');
  });

  cancelPortalBtn.addEventListener('click', () => {
    portalConfirmOverlay.classList.remove('show');
  });

  portalConfirmOverlay.addEventListener('click', e => {
    if (e.target === portalConfirmOverlay) {
      portalConfirmOverlay.classList.remove('show');
    }
  });

  confirmPortalBtn.addEventListener('click', () => {
    window.location.href = '../';
  });

  showStarterSelection();
})();
</script>
</body>
</html>
